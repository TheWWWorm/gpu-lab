name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.python-version }}, Pillow ${{ matrix.pillow }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        pillow: ['latest']
        include:
          - python-version: '3.10'
            pillow: '10.0.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: System test dependency
        run: sudo apt-get update && sudo apt-get install -y dbus-daemon
      - run: python -m pip install -r requirements.txt
      - name: Install minimum supported Pillow for compatibility check
        if: matrix.pillow != 'latest'
        run: python -m pip install "Pillow==${{ matrix.pillow }}"
      - name: Report tested versions
        run: python -c "import sys, PIL; print(sys.version); print('Pillow', PIL.__version__)"
      - run: make test
      - run: make check
      - name: Verify source archive
        run: make dist
